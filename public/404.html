<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    // GitHub Pages SPA redirect: store the path and redirect to the base URL.
    // The index.html picks this up and restores the URL via history.replaceState.
    var base = '/gamainstitute/';
    var path = location.pathname.replace(base, '');
    var search = location.search;
    var hash = location.hash;
    sessionStorage.setItem('spa-redirect', JSON.stringify({ path: path, search: search, hash: hash }));
    location.replace(base);
  </script>
</head>
<body></body>
</html>
